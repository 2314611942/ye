        <path d="M0-100V100M-100 0H100M-70.71-70.71 70.71 70.71M-70.71 70.71 70.71-70.71"/>
        <path d="m-38.27-92.39 76.54 184.78m-130.66-54.12 184.78-76.54m-184.78 0L92.39 38.27M-38.27 92.39 38.27-92.39"/>
